# Render Blueprint reference: the daily dispensary scrape, partner POS sync, and the
# daily store-photo copy.
#
# This file defines ONLY these three jobs. The existing `terpenomics` (Docker web
# service) and `terpenomics-ui` (static site) were created from the Render dashboard
# and are NOT managed here; adding this blueprint does not touch them.
#
# The scraper is a cron job. It used to need a background worker with a disk, because
# the per-SKU enrich cache that keeps model spend low lived in files there. With
# ENRICH_CACHE=db that cache lives in Postgres (db/migrations/0005), so a plain cron
# job keeps it across runs. (scripts/scrape_worker.py still works on a worker with a
# disk.)
#
# NOTE: Render auto-detects Blueprints only from a render.yaml at the REPO ROOT. This
# file lives in scripts/, so it is reference, not auto-synced. Create each job from the
# dashboard (New -> Cron Job -> this repo, Docker runtime) and transcribe the settings
# below, or move this file to the repo root to use it as a Blueprint.
#
# The sync:false env vars are secrets: set them in the dashboard. DATABASE_URL is on
# the terpenomics web service; all four scraper secrets are in this repo's Claude Code
# cloud environment.
services:
  - type: cron
    name: terpenomics-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python scripts/run_scrape_cron.py
    schedule: "0 13 * * *"     # 13:00 UTC: 9am in New York in summer, 8am in winter
    plan: starter
    region: oregon             # where the other terpenomics services run
    # Redeploy on every push to main. A deploy only rebuilds the image; a run already
    # going finishes on the old one.
    autoDeploy: true
    envVars:
      # --- secrets ---
      - key: DATABASE_URL
        sync: false
      # Enrichment (--model haiku-or) and catalog matching (Jev, typesafe/jev-1.13)
      # both go through OpenRouter on this key.
      - key: OPENROUTER_API_KEY
        sync: false
      # Brooklyn Organic Buds' menu (Alleaves) needs a login.
      - key: ALLEAVES_USER
        sync: false
      - key: ALLEAVES_PASS
        sync: false
      # Optional: a Slack/Discord-style incoming webhook; failed runs POST here.
      # Render also emails the owner when a run fails.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # --- behavior (safe defaults, edit freely) ---
      # Only stores marked "active" in dispensaries.json are run. The enrich cache is
      # namespaced per model, so switching models starts it cold.
      - key: SCRAPE_ARGS
        value: "--all --parallel --model haiku-or"
      - key: ENRICH_CACHE
        value: db              # the enrich cache in Postgres: no disk needed
      # The first run enriches every listing (about an hour); later runs take minutes.
      - key: SCRAPE_TIMEOUT_SEC
        value: "9000"
      - key: PYTHONUNBUFFERED
        value: "1"             # stream logs in real time to Render

  # Partner POS order sync — see POS_CONNECTORS.md. A cron job, not a worker:
  # unlike the scraper it needs no disk, and every run is independent (the
  # cursor lives in pos_connections). Like the worker above, create it from the
  # dashboard (New -> Cron Job) unless this file is moved to the repo root.
  - type: cron
    name: terpenomics-pos-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python scripts/pos_sync.py
    schedule: "*/15 * * * *"   # every 15 minutes
    plan: starter
    region: oregon             # TODO: match the region of the existing services
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POS_CREDENTIALS_KEY
        sync: false            # must be the same key the web service uses
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false            # reads uploaded receipts; without it they're reviewed by hand
      - key: PYTHONUNBUFFERED
        value: "1"

  # Store photos whose hosts cannot resize on request, copied into Supabase Storage
  # at web sizes (scripts/photo_mirror.py; PIPELINE.md). Its own job so the scraper
  # never holds the storage key. It copies what the day's scrape brought in, so it
  # runs after the scrape's latest possible finish (13:00 + SCRAPE_TIMEOUT_SEC);
  # anything it misses waits a day, and the listing shows the original meanwhile.
  # Without the two Supabase keys it exits 1, so a misconfigured job shows as failed.
  - type: cron
    name: terpenomics-photo-mirror
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python scripts/photo_mirror.py
    schedule: "0 16 * * *"     # 16:00 UTC, after the 13:00 scrape and its 150-min cap
    plan: starter
    region: oregon             # where the other terpenomics services run
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # reads listings, records what was copied
      - key: SUPABASE_URL
        sync: false            # same values as the terpenomics web service
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PHOTO_MIRROR_LIMIT
        value: "3000"          # photos per run, at most; a day brings tens
      - key: PYTHONUNBUFFERED
        value: "1"

  # The admin audits' jobs (scripts/audit_worker.py; routes/admin/audits.py queues
  # them): build an audit run, judge it with Claude, measure a proposal, apply an
  # approved one. --drain runs what is queued and exits; Render never overlaps two
  # runs of one cron job. For quicker turnaround make it a background worker running
  # `python scripts/audit_worker.py` (the loop) instead.
  - type: cron
    name: terpenomics-audit-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python scripts/audit_worker.py --drain --max-minutes 14
    schedule: "*/5 * * * *"
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false            # same values as the terpenomics web service
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false            # the LLM judge; without it runs are judged by hand
      - key: OPENROUTER_API_KEY
        sync: false            # Jev: measuring and re-matching re-read listings
      - key: READING_EXAMPLES
        value: db              # after scripts/import_reading_examples.py --write
      - key: PYTHONUNBUFFERED
        value: "1"
