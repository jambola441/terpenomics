# Reference only — this static site was created from the Render dashboard as
# `terpenomics-ui`, and Blueprints are auto-detected only from a render.yaml at
# the REPO ROOT. PR previews for it are enabled in the dashboard, not here:
# see PREVIEWS.md.
services:
  - type: web
    name: my-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
